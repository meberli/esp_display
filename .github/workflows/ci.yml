# CI on every push / PR: host unit tests and a firmware build with a
# throwaway signing key (the real key is only used by release.yml), then a
# generic secret scan of the image. No secrets are needed or used here.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No double-encoded UTF-8 (mojibake) in text files
        shell: python
        run: |
          # UTF-8 read as cp1252 and saved again (e.g. "\u00c3\u00bc" instead of "\u00fc").
          # The generated font files list U+00C3 legitimately and are skipped.
          import re, subprocess, sys
          bad = re.compile("\u00c3[\u0080-\u00bf\u2013-\u203a\u20ac\u2122\u0152\u0153\u0160\u0161\u0178\u017d\u017e\u0192\u02c6\u02dc]|\u00e2\u20ac|\u00c2[\u00a0-\u00bf]")
          files = subprocess.run(["git", "grep", "-Il", ""], capture_output=True, text=True).stdout.split()
          hits = 0
          for f in files:
              if re.match(r"main/font_.*\.c$", f):
                  continue
              for n, line in enumerate(open(f, encoding="utf-8", errors="replace"), 1):
                  if bad.search(line):
                      print(f"::error file={f},line={n}::mojibake (file saved with the wrong encoding)")
                      hits += 1
          sys.exit(1 if hits else 0)
      - name: Host tests
        run: |
          set -e
          g++ -std=c++17 -Wall -I main tools/test_ical.cpp main/ical.cpp -o /tmp/ti && TZ=Europe/Zurich /tmp/ti
          g++ -std=c++17 -Wall -I main -DOTA_VER_HOST tools/test_ota_ver.cpp -o /tmp/to && /tmp/to
          g++ -std=c++17 -Wall -I main tools/test_retry_logic.cpp -o /tmp/trl && /tmp/trl
          g++ -std=c++17 -Wall -I main -DLOX_CACHE_HOST tools/test_lox_cache.cpp main/loxone_cache.cpp -o /tmp/tlc && /tmp/tlc
          g++ -std=c++17 -Wall -I main tools/test_ota_board.cpp main/ota_board.cpp -o /tmp/tob && /tmp/tob
          g++ -std=c++17 -Wall -Itools/host_stub -Imain tools/test_settings_schema.cpp main/settings_schema.cpp -o /tmp/ts && /tmp/ts
          g++ -std=c++17 -Wall -I main -I components/ArduinoJson/src tools/test_waste_api.cpp main/waste_api.cpp main/ical.cpp -o /tmp/twa && TZ=Europe/Zurich /tmp/twa
          g++ -std=c++17 -Wall -I main -I components/ArduinoJson/src tools/test_energy.cpp main/energy.cpp -o /tmp/te && TZ=Europe/Zurich /tmp/te
          g++ -std=c++17 -Wall -I main tools/test_energy_mix.cpp main/energy_mix.cpp -o /tmp/tmix && /tmp/tmix
          g++ -std=c++17 -Wall -Wextra -I main tools/test_co4en.cpp main/co4en.cpp -o /tmp/tc && /tmp/tc
          g++ -std=c++17 -Wall -I main -I components/ArduinoJson/src tools/test_co4.cpp main/co4_data.cpp main/co4_bff.cpp main/co4_oidc.cpp -o /tmp/tco4 && TZ=Europe/Zurich /tmp/tco4
          g++ -std=c++17 -Wall -I main tools/test_pv.cpp main/pv.cpp -o /tmp/tp && /tmp/tp
          g++ -std=c++17 -Wall -I main tools/test_waste_window.cpp main/waste_window.cpp -o /tmp/tww && TZ=Europe/Zurich /tmp/tww
          g++ -std=c++17 -Wall -I main tools/test_weather_derive.cpp main/weather_derive.cpp -o /tmp/tw && /tmp/tw

  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build (throwaway signing key)
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          . "$IDF_PATH/export.sh"
          mkdir -p secure
          espsecure generate-signing-key --version 2 --scheme rsa3072 secure/signing_key.pem
          idf.py set-target esp32s3
          idf.py build
          idf.py -B build-d1 -DSDKCONFIG=build-d1/sdkconfig -DPANEL_BOARD=sensecap_d1 set-target esp32s3
          idf.py -B build-d1 -DSDKCONFIG=build-d1/sdkconfig -DPANEL_BOARD=sensecap_d1 build
          rm -f secure/signing_key.pem
          python tools/check_secrets.py --generic build/loxone_panel.bin
          python tools/check_secrets.py --generic build-d1/loxone_panel_sensecap_d1.bin
          idf.py size | tail -n 15
